<!DOCTYPE html>
<html>
<head>
    <title>My Todo List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 40px;
        }

        h1 {
            color: #333;
            text-align: center;
        }

        .container {
            width: 400px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        input[type="text"] {
            width: 70%;
            padding: 8px;
            font-size: 16px;
        }

        button {
            padding: 8px 12px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
        }

        button:hover {
            background-color: #45a049;
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin-top: 20px;
        }

        li {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        li.completed {
            text-decoration: line-through;
            color: gray;
        }

        .delete-btn {
            background-color: #f44336;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .delete-btn:hover {
            background-color: #d32f2f;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>My Todo List</h1>
        
        <input type="text" id="taskInput" placeholder="Enter a new task...">
        <button onclick="addTask()">Add</button>

        <ul id="taskList"></ul>
    </div>

    <script>
        // load tasks when page opens
        window.onload = function() {
            loadTasks();
        };

        function addTask() {
            var input = document.getElementById("taskInput");
            var taskText = input.value.trim();

            if (taskText === "") {
                alert("Please enter a task!");
                return;
            }

            var li = document.createElement("li");
            li.innerHTML = `
                <span onclick="toggleComplete(this)">${taskText}</span>
                <button class="delete-btn" onclick="deleteTask(this)">Delete</button>
            `;

            document.getElementById("taskList").appendChild(li);
            input.value = "";

            saveTasks();
        }

        function toggleComplete(span) {
            span.parentElement.classList.toggle("completed");
            saveTasks();
        }

        function deleteTask(btn) {
            btn.parentElement.remove();
            saveTasks();
        }

        function saveTasks() {
            var tasks = [];
            var listItems = document.querySelectorAll("#taskList li");

            listItems.forEach(function(li) {
                tasks.push({
                    text: li.querySelector("span").innerText,
                    completed: li.classList.contains("completed")
                });
            });

            localStorage.setItem("myTodos", JSON.stringify(tasks));
        }

        function loadTasks() {
            var saved = localStorage.getItem("myTodos");
            if (saved) {
                var tasks = JSON.parse(saved);
                tasks.forEach(function(task) {
                    var li = document.createElement("li");
                    if (task.completed) {
                        li.classList.add("completed");
                    }
                    li.innerHTML = `
                        <span onclick="toggleComplete(this)">${task.text}</span>
                        <button class="delete-btn" onclick="deleteTask(this)">Delete</button>
                    `;
                    document.getElementById("taskList").appendChild(li);
                });
            }
        }
    </script>

</body>
</html>
